name: Deploy Backend ECS

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Upload and restart Express
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          WORKSPACE_ID: ${{ secrets.WORKSPACE_ID }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TONGYI_API_KEY: ${{ secrets.TONGYI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          JIMENG_API_KEY: ${{ secrets.JIMENG_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          LONGXIA_API_KEY: ${{ secrets.LONGXIA_API_KEY }}
          YUANBAO_API_KEY: ${{ secrets.YUANBAO_API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo '=== Uploading server.js to ECS ==='
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 backend/server.js root@47.97.166.219:/opt/lsjy-app/backend/server.js
          echo '=== Restarting services ==='
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 root@47.97.166.219 <<'DEPLOY_EOF'
            set -e
            echo '--- Install express deps ---'
            cd /opt/lsjy-app/backend
            npm install express cors dotenv --no-save --no-audit --no-fund --no-package-lock 2>&1 | tail -5 || true
            echo '--- Restart Express ---'
            pm2 delete lsjy-express >/dev/null 2>&1 || true
            pm2 start /opt/lsjy-app/backend/server.js --name lsjy-express --update-env -- --port=3001
            sleep 8
            echo '--- PM2 status ---'
            pm2 list
            echo '--- Express error log ---'
            pm2 logs lsjy-express --lines 30 --nostream 2>&1 || true
            echo '--- Health checks ---'
            echo 'NestJS:'
            curl -s --max-time 10 http://localhost:3000/api/v1/health || echo 'FAILED'
            echo ''
            echo 'Express:'
            curl -s --max-time 10 http://localhost:3001/api/v1/health || echo 'FAILED'
            echo ''
            echo '--- Restart NestJS ---'
            pm2 restart lsjy-backend --update-env || true
            sleep 10
            echo '--- Final health checks ---'
            echo 'NestJS:'
            curl -s --max-time 10 http://localhost:3000/api/v1/health || echo 'FAILED'
            echo ''
            echo 'Express:'
            curl -s --max-time 10 http://localhost:3001/api/v1/health || echo 'FAILED'
            echo ''
            echo '=== Deploy complete ==='
          DEPLOY_EOF
